<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entries - MindLog</title>
    <link href="../../assets/css/output.css" rel="stylesheet">
    <link href="../../assets/css/dashboard-theme.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="dashboard.html" class="logo">MindLog</a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="categories.html" class="nav-link">Categories</a>
                <a href="profile.html" class="nav-link">Profile</a>
            </div>
            <div class="user-section">
                <span class="user-name" id="navDisplayName">@user</span>
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                    <span id="themeIcon">☀️</span>
                </button>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="page-header flex justify-between items-end">
            <div>
                <a href="dashboard.html" class="back-to-dashboard">
                    <i data-lucide="arrow-left"></i> Back to Dashboard
                </a>
                <h1 class="greeting" id="pageTitle">Journal Entries</h1>
                <p class="subtitle" id="pageSubtitle">Your personal collection of thoughts and memories</p>
            </div>
            
            <a href="new-entry.html" class="new-entry-btn hidden sm:flex">
                <span class="plus-icon">+</span>
                <span>New Entry</span>
            </a>
        </div>

        <!-- Filter info (hidden by default) -->
        <div id="filterInfo" class="hidden mb-6 flex items-center gap-2 text-sm text-light/60 bg-surface-elevated/50 p-3 rounded-lg border border-border-subtle w-fit">
            <i data-lucide="filter" class="w-4 h-4"></i>
            <span>Filtered by: <span id="activeFilter" class="font-semibold text-primary"></span></span>
            <button id="clearFilterBtn" class="ml-2 hover:text-red-400 transition-colors" title="Clear filter">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Entries Grid -->
        <div id="entriesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Entries will be loaded here -->
            <div class="col-span-full text-center py-12">
                <div class="animate-pulse flex flex-col items-center">
                    <div class="h-8 w-8 bg-gray-200 rounded-full mb-4"></div>
                    <div class="h-4 w-48 bg-gray-200 rounded mb-2"></div>
                    <div class="h-4 w-32 bg-gray-200 rounded"></div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-24">
            <i data-lucide="book-open" class="w-20 h-20 mx-auto text-light/20 mb-6"></i>
            <h3 class="text-2xl font-semibold text-light/60 mb-2">No entries found</h3>
            <p class="text-light/40 mb-8 max-w-md mx-auto">We couldn't find any journal entries matching your valid criteria.</p>
            <a href="new-entry.html" class="inline-block px-8 py-4 bg-gradient-to-r from-primary to-secondary text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1">
                Create New Entry
            </a>
        </div>

        <!-- Pagination (Simple, can be expanded) -->
        <div id="pagination" class="hidden mt-12 flex justify-center gap-4">
            <button id="prevPageBtn" class="px-4 py-2 bg-surface border border-border-subtle rounded-lg disabled:opacity-50">Previous</button>
            <span id="pageInfo" class="px-4 py-2 text-text-secondary">Page 1</span>
            <button id="nextPageBtn" class="px-4 py-2 bg-surface border border-border-subtle rounded-lg disabled:opacity-50">Next</button>
        </div>
    </div>

    <!-- Mobile FAB -->
    <a href="new-entry.html" class="md:hidden fixed bottom-8 right-8 w-14 h-14 bg-gradient-to-br from-accent-purple to-accent-primary rounded-full shadow-lg flex items-center justify-center text-white text-2xl z-50 hover:scale-110 transition-transform">
        +
    </a>

    <!-- Scripts -->
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/entries.js"></script>
    <script>
        lucide.createIcons();

        // Check auth
        if (!api.isAuthenticated()) {
            window.location.href = 'login.html';
        }

        // Theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        themeIcon.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeIcon.textContent = newTheme === 'dark' ? '🌙' : '☀️';
        });

        // Load user info for navbar
        async function loadUserInfo() {
            try {
                const navDisplayName = document.getElementById('navDisplayName');
                if (!navDisplayName) return;

                const response = await api.request('/auth/me', 'GET');
                if (response.success) {
                    navDisplayName.textContent = `@${response.username}`;
                }
            } catch (error) {
                console.error('Failed to load user info:', error);
            }
        }
        
        loadUserInfo();
    </script>
</body>
</html>
