<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Entry - MindLog</title>
    <link href="../../assets/css/output.css" rel="stylesheet">
    <link href="../../assets/css/dashboard-theme.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Quill Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <style>
        /* Quill Editor Theming */
        .ql-toolbar.ql-snow {
            background: var(--surface);
            border: 2px solid var(--border-subtle);
            border-radius: 12px 12px 0 0;
            border-bottom: none;
        }
        
        .ql-toolbar .ql-stroke {
            stroke: var(--text-secondary);
        }
        
        .ql-toolbar .ql-fill {
            fill: var(--text-secondary);
        }
        
        .ql-toolbar .ql-picker-label {
            color: var(--text-secondary);
        }
        
        .ql-toolbar button:hover .ql-stroke,
        .ql-toolbar button.ql-active .ql-stroke {
            stroke: var(--accent-primary);
        }
        
        .ql-toolbar button:hover .ql-fill,
        .ql-toolbar button.ql-active .ql-fill {
            fill: var(--accent-primary);
        }
        
        .ql-container.ql-snow {
            background: var(--surface);
            border: 2px solid var(--border-subtle);
            border-radius: 0 0 12px 12px;
            color: var(--text-primary);
        }
        
        .ql-editor {
            color: var(--text-primary);
            min-height: 400px;
            font-size: 1rem;
            line-height: 1.6;
        }
        
        .ql-editor.ql-blank::before {
            color: var(--text-tertiary);
            font-style: normal;
        }
        
        /* Light mode specific fixes */
        [data-theme="light"] .ql-editor {
            background: var(--surface);
        }
        
        [data-theme="light"] .ql-toolbar.ql-snow {
            background: var(--surface);
        }
        
        /* Responsive Quill Editor */
        @media (max-width: 768px) {
            .ql-editor {
                min-height: 300px;
                font-size: 0.95rem;
            }
            
            .ql-toolbar.ql-snow {
                padding: 0.5rem;
            }
            
            .ql-toolbar button {
                width: 28px;
                height: 28px;
            }
            
            .ql-toolbar .ql-picker {
                font-size: 0.85rem;
            }
        }
        
        @media (max-width: 480px) {
            .ql-editor {
                min-height: 250px;
                font-size: 0.9rem;
            }
            
            .ql-toolbar button {
                width: 24px;
                height: 24px;
            }
        }
    </style>
</head>
<body class="bg-dark text-light font-sans antialiased">

    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="dashboard.html" class="logo">MindLog</a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="categories.html" class="nav-link">Categories</a>
                <a href="profile.html" class="nav-link">Profile</a>
            </div>
            <div class="user-section">
                <span class="user-name" id="navDisplayName">@user</span>
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                    <span id="themeIcon">☀️</span>
                </button>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="page-header">
            <h1 class="greeting">Create New Entry</h1>
            <p class="subtitle">Express your thoughts and feelings</p>
        </div>

        <!-- Back to Dashboard Link -->
        <a href="dashboard.html" class="back-to-dashboard">
            <i data-lucide="arrow-left"></i>
            Back to Dashboard
        </a>

        <!-- Entry Form -->
        <form id="entryForm" class="entry-form">
            <!-- Title -->
            <div class="form-group">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" required 
                    class="form-input" 
                    placeholder="Give your entry a meaningful title...">
            </div>

            <!-- Rich Text Editor -->
            <div class="form-group">
                <label class="form-label">Content</label>
                <div id="editor"></div>
            </div>

            <!-- Mood and Favorite Row -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
                <!-- Mood -->
                <div class="form-group">
                    <label for="mood" class="form-label">Mood (Optional)</label>
                    <select id="mood" class="form-select">
                        <option value="">Select a mood...</option>
                        <option value="happy">😊 Happy</option>
                        <option value="sad">😢 Sad</option>
                        <option value="excited">🎉 Excited</option>
                        <option value="anxious">😰 Anxious</option>
                        <option value="calm">😌 Calm</option>
                        <option value="angry">😠 Angry</option>
                        <option value="neutral">😐 Neutral</option>
                        <option value="grateful">🙏 Grateful</option>
                        <option value="tired">😴 Tired</option>
                        <option value="motivated">💪 Motivated</option>
                    </select>
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label for="category" class="form-label">Category (Optional)</label>
                    <select id="category" class="form-select">
                        <option value="">Select a category...</option>
                        <!-- Categories will be loaded dynamically -->
                    </select>
                </div>

                <!-- Favorite Toggle -->
                <div class="form-group">
                    <label class="form-label">Mark as Favorite</label>
                    <label class="form-checkbox-wrapper">
                        <input type="checkbox" id="isFavorite" class="form-checkbox">
                        <span class="form-checkbox-label">Add to favorites</span>
                    </label>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="form-actions">
                <button type="submit" id="submitEntry" class="btn-primary-gradient">
                    Save Entry
                </button>
                <a href="dashboard.html" class="btn-secondary">
                    Cancel
                </a>
            </div>
        </form>

        <!-- Draft Status Indicator -->
        <div id="draftStatus" class="fixed bottom-6 right-6 px-4 py-2 bg-dark/90 border border-light/20 rounded-lg text-sm text-light/60 backdrop-blur-lg hidden transition-all">
            <i data-lucide="save" class="w-4 h-4 inline-block mr-2"></i>
            <span id="draftStatusText">Draft saved</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/draft-manager.js"></script>
    <script src="./js/main.js"></script>
    <script>
        lucide.createIcons();

        // Theme toggle functionality
        const savedTheme = localStorage.getItem('theme') || 'light';
        const themeIcon = document.getElementById('themeIcon');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            if (themeIcon) themeIcon.textContent = '🌙';
        }
        
        document.getElementById('themeToggle').addEventListener('click', function() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            if (themeIcon) themeIcon.textContent = newTheme === 'dark' ? '🌙' : '☀️';
        });

        // Load user info for navbar
        async function loadUserInfo() {
            try {
                const response = await api.request('/auth/me', 'GET');
                if (response.success && response.data) {
                    const displayName = document.getElementById('navDisplayName');
                    if (displayName) {
                        displayName.textContent = `@${response.data.username}`;
                    }
                }
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }

        // Load categories for dropdown
        async function loadCategories() {
            try {
                const response = await api.request('/category', 'GET');
                if (response.success && response.data) {
                    const categorySelect = document.getElementById('category');
                    const categories = Array.isArray(response.data) ? response.data : [];
                    
                    categories.forEach(category => {
                        const option = document.createElement('option');
                        option.value = category._id;
                        option.textContent = `${category.icon || '📁'} ${category.name}`;
                        categorySelect.appendChild(option);
                    });
                }
            } catch (error) {
                // Silently handle if user has no categories yet (404 is expected)
                if (error.message && !error.message.includes('not found')) {
                    console.error('Error loading categories:', error);
                }
            }
        }

        // Logout functionality
        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            api.logout();
            window.location.href = '../auth/login.html';
        });

        // Initialize user info and categories
        loadUserInfo();
        loadCategories();

        // Check auth
        if (!api.isAuthenticated()) {
            window.location.href = 'login.html';
        }

        // Initialize Quill editor
        const quill = new Quill('#editor', {
            theme: 'snow',
            placeholder: 'Write your thoughts here...',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    [{ 'size': ['small', false, 'large', 'huge'] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'align': [] }],
                    ['link', 'blockquote', 'code-block'],
                    ['clean']
                ]
            }
        });

        // Draft auto-save functionality
        const DRAFT_TYPE = 'new-entry';
        let autoSaveTimeout = null;
        const AUTO_SAVE_DELAY = 2000; // 2 seconds

        // Elements
        const titleInput = document.getElementById('title');
        const moodSelect = document.getElementById('mood');
        const categorySelect = document.getElementById('category');
        const isFavoriteCheckbox = document.getElementById('isFavorite');
        const draftStatusEl = document.getElementById('draftStatus');
        const draftStatusText = document.getElementById('draftStatusText');
        const entryForm = document.getElementById('entryForm');
        const submitBtn = document.getElementById('submitEntry');

        /**
         * Get current form data
         */
        function getFormData() {
            return {
                title: titleInput.value,
                content: quill.root.innerHTML,
                mood: moodSelect.value,
                categoryId: categorySelect.value,
                isFavorite: isFavoriteCheckbox.checked
            };
        }

        /**
         * Set form data
         */
        function setFormData(data) {
            if (data.title) titleInput.value = data.title;
            if (data.content) quill.root.innerHTML = data.content;
            if (data.mood) moodSelect.value = data.mood;
            if (data.categoryId) categorySelect.value = data.categoryId;
            if (data.isFavorite !== undefined) isFavoriteCheckbox.checked = data.isFavorite;
        }

        /**
         * Show draft status message
         */
        function showDraftStatus(message, duration = 3000) {
            draftStatusText.textContent = message;
            draftStatusEl.classList.remove('hidden');
            
            setTimeout(() => {
                draftStatusEl.classList.add('hidden');
            }, duration);
        }

        /**
         * Save draft with debouncing
         */
        function scheduleDraftSave() {
            // Clear existing timeout
            if (autoSaveTimeout) {
                clearTimeout(autoSaveTimeout);
            }

            // Schedule new save
            autoSaveTimeout = setTimeout(() => {
                const formData = getFormData();
                
                // Only save if there's content
                if (formData.title || formData.content !== '<p><br></p>') {
                    const success = DraftManager.saveDraft(DRAFT_TYPE, formData);
                    if (success) {
                        const draft = DraftManager.getDraft(DRAFT_TYPE);
                        const timeAgo = DraftManager.getTimeAgo(draft.timestamp);
                        showDraftStatus(`Draft saved ${timeAgo}`);
                    }
                }
            }, AUTO_SAVE_DELAY);
        }

        /**
         * Check for existing draft and offer recovery
         */
        function checkForDraft() {
            const draft = DraftManager.getDraft(DRAFT_TYPE);
            
            if (draft && draft.data) {
                const timeAgo = DraftManager.getTimeAgo(draft.timestamp);
                const message = `You have an unsaved draft from ${timeAgo}. Would you like to recover it?`;
                
                if (confirm(message)) {
                    setFormData(draft.data);
                    showDraftStatus('Draft recovered successfully');
                } else {
                    DraftManager.clearDraft(DRAFT_TYPE);
                }
            }
        }

        // Check for draft on page load
        checkForDraft();

        // Add auto-save listeners
        titleInput.addEventListener('input', scheduleDraftSave);
        moodSelect.addEventListener('change', scheduleDraftSave);
        categorySelect.addEventListener('change', scheduleDraftSave);
        isFavoriteCheckbox.addEventListener('change', scheduleDraftSave);
        quill.on('text-change', scheduleDraftSave);

        // Save draft before page unload
        window.addEventListener('beforeunload', (e) => {
            const formData = getFormData();
            if (formData.title || formData.content !== '<p><br></p>') {
                DraftManager.saveDraft(DRAFT_TYPE, formData);
            }
        });

        // Handle form submission
        entryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';
            
            const formData = getFormData();
            
            try {
                const response = await api.request('/journal/create', 'POST', {
                    title: formData.title,
                    content: formData.content,
                    mood: formData.mood || undefined,
                    categoryId: formData.categoryId || undefined,
                    isFavorite: formData.isFavorite
                });
                
                if (response.success) {
                    // Clear draft after successful submission
                    DraftManager.clearDraft(DRAFT_TYPE);
                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                console.error('Failed to create entry:', error);
                alert(error.message || 'Failed to create entry');
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        // Reinitialize lucide icons for draft status
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
